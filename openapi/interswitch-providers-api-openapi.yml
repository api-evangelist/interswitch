openapi: 3.2.0
info:
  title: Interswitch Lending Providers API
  description: 'Marketplace lending APIs connecting loan providers and distribution

    channels — list providers, fetch offers, accept offers, fund loans, debit

    for repayment, and inspect customer loan status. Supports PCI-DSS-licensed

    and hosted-fields integrations and powers Nano Loans, Salary Lending, and

    Value Financing.

    '
  version: '2024-01-01'
servers:
- url: https://sandbox.interswitchng.com
  description: Sandbox
- url: https://saturn.interswitchng.com
  description: Production
security:
- BearerAuth: []
tags:
- name: Providers
paths:
  /lending-service/api/v1/offers/providers:
    get:
      tags:
      - Providers
      summary: List Loan Providers
      operationId: listLoanProviders
      responses:
        '200':
          description: Available lenders.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    providerId:
                      type: string
                    name:
                      type: string
                    products:
                      type: array
                      items:
                        type: string
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
