openapi: 3.2.0
info:
  title: Interswitch Card 360 PIN API
  description: 'Card issuer and cardholder lifecycle management for Verve, debit, and

    prepaid cards — create cards, set/reset PIN, block/unblock, balance

    inquiry, card linking, and card validation. Lets fintechs and banks

    issue and operate Verve cards programmatically on the Interswitch

    issuer-processor.

    '
  version: '2024-01-01'
servers:
- url: https://sandbox.interswitchng.com
  description: Sandbox
- url: https://saturn.interswitchng.com
  description: Production
security:
- BearerAuth: []
tags:
- name: PIN
paths:
  /card-360/api/v1/cards/{cardId}/pin:
    post:
      tags:
      - PIN
      summary: Set Or Reset Card PIN
      operationId: setCardPin
      parameters:
      - in: path
        name: cardId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pinBlock
              properties:
                pinBlock:
                  type: string
                  description: ISO-9564 PIN block.
      responses:
        '200':
          description: PIN updated.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
