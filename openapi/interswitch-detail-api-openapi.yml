openapi: 3.2.0
info:
  title: Interswitch Transaction Search Detail API
  description: 'Back-office transaction and settlement verification — Quick Search,

    Reference Search, Bulk Search, and Transaction Detail lookups across

    Quickteller Business, Webpay, Transfers, and Bills Payment.

    '
  version: '2024-01-01'
servers:
- url: https://qa.interswitchng.com
  description: Sandbox / QA
- url: https://saturn.interswitchng.com
  description: Production
security:
- BearerAuth: []
tags:
- name: Detail
paths:
  /transaction-search/api/v1/transactions/{transactionId}:
    get:
      tags:
      - Detail
      summary: Get Transaction Detail
      operationId: getTransactionDetail
      parameters:
      - in: path
        name: transactionId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Full transaction detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
components:
  schemas:
    Transaction:
      type: object
      properties:
        transactionId:
          type: string
        transactionRef:
          type: string
        type:
          type: string
          enum:
          - PAYMENT
          - TRANSFER
          - BILL
          - AIRTIME
          - REFUND
          - PAYCODE
        status:
          type: string
        responseCode:
          type: string
        amount:
          type: integer
        currency:
          type: string
        customerId:
          type: string
        merchantCode:
          type: string
        terminalId:
          type: string
        cardPanMasked:
          type: string
        cardScheme:
          type: string
        settlementDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
