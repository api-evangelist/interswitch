openapi: 3.1.0
info:
  title: Interswitch Recharge Airtime PIN API
  description: 'Virtual top-up (direct airtime and data) and e-pin voucher delivery for

    MTN, Airtel, Glo, and 9mobile. Same biller / category / payment-item flow

    as Bills Payment; category ID `4` is reserved for airtime billers and the

    customer''s phone number is supplied as `customer_id` on the payment advice.

    '
  version: '2024-01-01'
servers:
- url: https://sandbox.interswitchng.com
  description: Sandbox
- url: https://saturn.interswitchng.com
  description: Production
security:
- InterswitchAuth: []
tags:
- name: PIN
paths:
  /card-360/api/v1/cards/{cardId}/pin:
    post:
      tags:
      - PIN
      summary: Set Or Reset Card PIN
      operationId: setCardPin
      parameters:
      - in: path
        name: cardId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pinBlock
              properties:
                pinBlock:
                  type: string
                  description: ISO-9564 PIN block.
      responses:
        '200':
          description: PIN updated.
components:
  securitySchemes:
    InterswitchAuth:
      type: apiKey
      in: header
      name: Authorization
