openapi: 3.2.0
info:
  title: Interswitch Payment Gateway Three-D Secure API
  description: 'Server-to-server card payment APIs for PCI-DSS-licensed merchants — direct

    Card Payments, Hosted Fields tokenization, 3D Secure step-up, Google Pay,

    and Pay Bill payment-link generation. Authenticated with OAuth 2.0

    client_credentials via the Passport token service.

    '
  version: '2024-01-01'
servers:
- url: https://qa.interswitchng.com
  description: Sandbox / QA
- url: https://saturn.interswitchng.com
  description: Production
security:
- BearerAuth: []
tags:
- name: Three-D Secure
  description: Step-up authentication
paths:
  /paymentgateway/api/v1/three-d-secure/sessions:
    post:
      tags:
      - Three-D Secure
      summary: Create 3D Secure Session
      operationId: createThreeDSecureSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - paymentId
              - returnUrl
              properties:
                paymentId:
                  type: string
                returnUrl:
                  type: string
                  format: uri
      responses:
        '200':
          description: Step-up redirect details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  acsUrl:
                    type: string
                    format: uri
                  pareq:
                    type: string
                  md:
                    type: string
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer token from `POST {passport}/passport/oauth/token?grant_type=client_credentials`.
