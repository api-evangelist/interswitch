openapi: 3.2.0
info:
  title: Interswitch Card 360 Balance API
  description: 'Card issuer and cardholder lifecycle management for Verve, debit, and

    prepaid cards — create cards, set/reset PIN, block/unblock, balance

    inquiry, card linking, and card validation. Lets fintechs and banks

    issue and operate Verve cards programmatically on the Interswitch

    issuer-processor.

    '
  version: '2024-01-01'
servers:
- url: https://sandbox.interswitchng.com
  description: Sandbox
- url: https://saturn.interswitchng.com
  description: Production
security:
- BearerAuth: []
tags:
- name: Balance
paths:
  /card-360/api/v1/cards/{cardId}/balance:
    get:
      tags:
      - Balance
      summary: Get Card Balance
      operationId: getCardBalance
      parameters:
      - in: path
        name: cardId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Balance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: integer
                    description: Minor currency units.
                  currency:
                    type: string
                  availableBalance:
                    type: integer
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
