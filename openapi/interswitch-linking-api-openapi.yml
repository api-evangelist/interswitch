openapi: 3.2.0
info:
  title: Interswitch Card 360 Linking API
  description: 'Card issuer and cardholder lifecycle management for Verve, debit, and

    prepaid cards — create cards, set/reset PIN, block/unblock, balance

    inquiry, card linking, and card validation. Lets fintechs and banks

    issue and operate Verve cards programmatically on the Interswitch

    issuer-processor.

    '
  version: '2024-01-01'
servers:
- url: https://sandbox.interswitchng.com
  description: Sandbox
- url: https://saturn.interswitchng.com
  description: Production
security:
- BearerAuth: []
tags:
- name: Linking
paths:
  /card-360/api/v1/cards/link:
    post:
      tags:
      - Linking
      summary: Link Card To Customer
      operationId: linkCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - cardPan
              - customerId
              properties:
                cardPan:
                  type: string
                customerId:
                  type: string
      responses:
        '200':
          description: Linked.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
